_min_copier_version: "9.18.2"
_subdirectory: template
# Render every template file. The application embeds TypeScript, service-worker
# and browser code, so the Factory's delimiters are used instead of Jinja's
# default double braces. Binary assets (the SQLite WASM runtime) are copied
# byte-for-byte by Copier.
_templates_suffix: ""
_envops:
  variable_start_string: "§§deploy_your_startup."
  variable_end_string: "§§"
  block_start_string: "§§%"
  block_end_string: "%§§"
  comment_start_string: "§§#"
  comment_end_string: "#§§"
  keep_trailing_newline: true
_exclude:
  - .git
  - copier.yml
  - TEMPLATE.md
  - "**/node_modules"
  - "**/dist"
  - "**/playwright-report"
  - "**/test-results"
  - "**/DerivedData"
  - "**/*.xcresult"
  - "**/.local-ios"
  - "**/.DS_Store"

project_name:
  type: str
  help: Project name in lowercase kebab-case, also used for local storage names
  default: my-local-first-app

app_title:
  type: str
  help: Human readable application title shown in the browser and the page header
  default: "§§deploy_your_startup.project_name | replace('-', ' ') | title§§"

ios_display_name:
  type: str
  help: Name shown under the application icon on iOS
  default: "§§deploy_your_startup.app_title§§"

ios_bundle_identifier:
  type: str
  help: Bundle identifier for the iOS application; it must be unique for your team
  default: "com.example.§§deploy_your_startup.project_name§§"

web_origin:
  type: str
  help: HTTPS origin the iOS shell loads (a CDN or a Cloudflare Tunnel); plain http is only accepted on localhost
  default: "http://localhost:4173"

app_bound_domain:
  type: str
  help: Hostname allowed by WKAppBoundDomains. It is derived from web_origin; change web_origin instead
  default: "§§deploy_your_startup.web_origin.split('://')[1].split('/')[0].split(':')[0]§§"
